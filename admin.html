<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30090f"><title>Staff Workspace | Rehobolts Power Solutions</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#241014;background:#fff7f7;--red:#c62828;--dark:#30090f;--line:#f0dfe1}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px 20px}.top{background:var(--dark);color:white;padding:22px 0}.topin{max-width:1180px;margin:auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:850;letter-spacing:.04em}.brand small{display:block;color:#f5b8bd;font-size:10px;letter-spacing:.18em}.muted{color:#856d70}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #30090f0a}.login{max-width:430px;margin:8vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:10px;width:100%}button{border:0;border-radius:10px;padding:11px 16px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff0f0;color:var(--dark)}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat strong{display:block;font-size:28px;margin-top:8px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.nav button{background:#fff;color:var(--dark);border:1px solid var(--line)}.nav button.active{background:var(--dark);color:white}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#856d70;font-size:11px;text-transform:uppercase;letter-spacing:.08em}td select{padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff} .tablewrap{overflow:auto}.notice{padding:12px;border-radius:10px;background:#fff0f0;color:#7b1724;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.shell{padding:20px 14px}.panel{padding:16px}}
</style></head><body><header class="top"><div class="topin"><div class="brand">REHOBOLTS<small>POWER SOLUTIONS · STAFF WORKSPACE</small></div><button id="logout" class="secondary hidden">Sign out</button></div></header><main class="shell">
<section id="login" class="panel login"><h1>Staff sign in</h1><p class="muted">Use your invited Rehobolts staff account.</p><form id="loginForm"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" type="submit">Sign in securely</button><p id="loginError" class="notice hidden"></p></form></section>
<section id="app" class="hidden"><div class="row"><div><h1>Operations overview</h1><p id="welcome" class="muted">Your Rehobolts workspace</p></div><button id="refresh" class="secondary">Refresh data</button></div><div class="stats"><div class="panel stat"><span class="muted">Enquiries</span><strong id="count-enquiries">—</strong></div><div class="panel stat"><span class="muted">Customers</span><strong id="count-customers">—</strong></div><div class="panel stat"><span class="muted">Quotes</span><strong id="count-quotes">—</strong></div><div class="panel stat"><span class="muted">Orders</span><strong id="count-orders">—</strong></div></div><nav class="nav" id="nav"></nav><div class="panel"><div class="row"><div><h2 id="tableTitle">Enquiries</h2><p id="tableHint" class="muted">Recent customer enquiries</p></div><span id="loadState" class="muted"></span></div><div id="message" class="notice hidden"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></section></main>
<script>
const sb=window.supabase.createClient('https://tjrlmjvoujlfkderxive.supabase.co','sb_publishable_YdLKDUm_iw6yCeW9rDT1NQ_h-WfycX2');
const $=id=>document.getElementById(id);let staff=null,current='enquiries';
const tables={enquiries:['id','customer_name','phone','email','enquiry_type','status','created_at'],customers:['id','name','phone','email','created_at'],products:['id','name','category','selling_price','stock_quantity','is_active'],quotes:['id','quote_number','customer_id','status','total_amount','created_at'],orders:['id','order_number','customer_id','status','total_amount','created_at'],payments:['id','order_id','amount','payment_method','status','created_at'],installations:['id','customer_id','status','scheduled_date','created_at'],staff_members:['id','full_name','email','role','is_active']};
async function showApp(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');const {data,error}=await sb.from('staff_members').select('id,full_name,email,role,is_active').eq('id',session.user.id).maybeSingle();if(error||!data||!data.is_active){await sb.auth.signOut();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginError').textContent='This account is not an active Rehobolts staff account. Contact the workspace owner.';$('loginError').classList.remove('hidden');return;}staff=data;$('welcome').textContent=(data.full_name||data.email)+' · '+data.role;buildNav();await refreshAll();}
function buildNav(){$('nav').innerHTML='';Object.keys(tables).forEach(t=>{const b=document.createElement('button');b.textContent=t.replace('_',' ');b.className=t===current?'active':'';b.onclick=()=>loadTable(t);$('nav').append(b);});}
async function count(table){const {count,error}=await sb.from(table).select('*',{count:'exact',head:true});return error?'—':count??0;}
async function refreshAll(){for(const t of ['enquiries','customers','quotes','orders'])$('count-'+t).textContent=await count(t);await loadTable(current);}
async function loadTable(t){current=t;buildNav();$('tableTitle').textContent=t.replace('_',' ');$('tableHint').textContent='Latest records · staff access only';$('loadState').textContent='Loading…';$('message').classList.add('hidden');const cols=tables[t];let q=sb.from(t).select(cols.join(',')).limit(100);if(t==='enquiries')q=q.order('created_at',{ascending:false});const {data,error}=await q;$('loadState').textContent='';if(error){$('message').textContent=error.message;$('message').classList.remove('hidden');$('thead').innerHTML='';$('tbody').innerHTML='';return;}$('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+c.replaceAll('_',' ')+'</th>').join('')+'</tr>';$('tbody').innerHTML='';(data||[]).forEach(item=>{const tr=document.createElement('tr');cols.forEach(c=>{const td=document.createElement('td');if(t==='enquiries'&&c==='status'){const sel=document.createElement('select');['new','contacted','qualified','quoted','converted','closed','cancelled'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=item[c]===v;sel.append(o)});sel.onchange=()=>updateStatus(item.id,sel.value);td.append(sel);}else{let val=item[c];td.textContent=val==null?'—':String(val).slice(0,100);}tr.append(td)});$('tbody').append(tr)});if(!data?.length)$('tbody').innerHTML='<tr><td colspan="'+cols.length+'">No records found.</td></tr>';}
async function updateStatus(id,status){const {error}=await sb.from('enquiries').update({status}).eq('id',id);if(error){$('message').textContent='Could not update status: '+error.message;$('message').classList.remove('hidden');}else $('loadState').textContent='Status saved';}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginError').classList.add('hidden');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginError').textContent=error.message;$('loginError').classList.remove('hidden');return;}await showApp(data.session);};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=refreshAll;
sb.auth.getSession().then(({data})=>{if(data.session)showApp(data.session)});
</script></body></html>
